name: phantomforge

services:
  postgres:
    image: postgres:16-alpine
    container_name: pf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: phantomforge
      POSTGRES_PASSWORD: phantomforge
      POSTGRES_DB: phantomforge
    ports:
      - "5432:5432"
    volumes:
      - pf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantomforge -d phantomforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pf-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - pf-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    # RustFS: S3-compatible storage. MinIO stopped publishing its Docker images
    # (minio/minio and quay.io/minio are gone), so this replaces it 1:1 - same
    # ports, same S3 API, same credentials, no app code changes.
    image: rustfs/rustfs:latest
    container_name: pf-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: phantomforge
      RUSTFS_SECRET_KEY: phantomforge
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pf-storage-data:/data

  storage-init:
    image: amazon/aws-cli:latest
    container_name: pf-storage-init
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: phantomforge
      AWS_SECRET_ACCESS_KEY: phantomforge
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        S3="aws --endpoint-url http://storage:9000 s3api"
        for i in $$(seq 1 30); do $$S3 list-buckets >/dev/null 2>&1 && break; sleep 2; done
        $$S3 head-bucket --bucket phantomforge 2>/dev/null || $$S3 create-bucket --bucket phantomforge
        $$S3 put-bucket-policy --bucket phantomforge --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::phantomforge/*"}]}'
        echo "Storage bucket ready"

volumes:
  pf-postgres-data:
  pf-redis-data:
  pf-storage-data:
