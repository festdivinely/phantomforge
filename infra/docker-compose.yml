name: phantomforge

services:
  postgres:
    image: postgres:16-alpine
    container_name: pf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: phantomforge
      POSTGRES_PASSWORD: phantomforge
      POSTGRES_DB: phantomforge
    ports:
      - "5432:5432"
    volumes:
      - pf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantomforge -d phantomforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pf-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - pf-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pf-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: phantomforge
      MINIO_ROOT_PASSWORD: phantomforge
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pf-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: pf-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 phantomforge phantomforge
        mc mb --ignore-existing local/phantomforge
        mc anonymous set download local/phantomforge
        echo "MinIO bucket ready"

volumes:
  pf-postgres-data:
  pf-redis-data:
  pf-minio-data:
